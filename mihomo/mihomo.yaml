# 注意规则在满足自己需求情况下，尽量做到精简，不要过度复杂，以免影响性能。
A: &A
  filter: "^(?!.*(套餐|重置|剩余|到期|订阅|群|账户|流量|有效期|时间|官网|失联|余额)).*$"
  use:
    - 1.主要地址
    - 2.备用地址
    - 3.额外地址

# 健康检查
p: &p
  type: http
  interval: 86400
  health-check:
    enable: true
    url: https://www.gstatic.com/generate_204
    interval: 600
  proxy: 🔄 订阅更新
  header: # 如遇订阅加载不出来请切换ua
    User-Agent: # 使用注释法由上到下 默认使用第一个
      - "mihomo"
      - "clash.meta/alpha-de19f92"
      - "clash-verge/v2.2.3"
      - "ClashMetaForAndroid/2.11.2.Meta"
      - "ClashforWindows/0.19.23"
      - "clash.meta"

proxy-providers: # ← 此函数位置请勿变动！此为模块更新时备份恢复订阅变量范围 ↓
  1.主要地址: # 直接使用
    <<: *p
    # override:
    #   additional-prefix: "Main："
    path: ./proxies/Provider1.yaml
    # url: "http://127.0.0.1:38324/download/one?target=ClashMeta"
    url: ""

  2.备用地址: # 需要前置
    <<: *p
    override:
      dialer-proxy: 🔗 链式代理基点
    #   additional-prefix: "Minor："
    path: ./proxies/Provider2.yaml
    url: ""

  3.额外地址: # 机场
    <<: *p
    # override:
    #   additional-prefix: "Additi："
    path: ./proxies/Provider3.yaml
    url: ""

# 节点信息
proxies:
  - { name: 直连, type: direct, udp: true }

# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: true
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: "strict"
# interface-name: en0
global-client-fingerprint: chrome
keep-alive-idle: 600
keep-alive-interval: 15
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true

# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: "ui"
external-ui-name: zashboard
external-ui-url: "https://github.com/Zephyruso/zashboard/archive/refs/heads/gh-pages.zip"

# 嗅探
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# 入站
tun:
  enable: true
  # system/gvisor/mixed
  stack: mixed
  dns-hijack: ["any:53","tcp://any:53","any:853","tcp://any:853"]
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  strict-route: true

# DNS模块
dns:
  enable: true
  cache-algorithm: arc
  prefer-h3: false
  listen: 127.0.0.1:1053
  ipv6: false

  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - geosite:private
    - geosite:category-ntp
    - +.lan
    - +.local
    - +.localhost
    - time.*.com
    - time.*.gov
    - time.*.edu.cn
    - time.*.apple.com
    - time-ios.apple.com
    - time1.cloud.tencent.com
    - time.ustc.edu.cn
    - pool.ntp.org
    - ntp.*.com
    - ntp.*.com.cn
    - ntp.ntsc.ac.cn

  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6

  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  direct-nameserver:
    - https://223.5.5.5/dns-query
    - https://223.6.6.6/dns-query

  direct-nameserver-follow-policy: false

  nameserver-policy:
    "rule-set:private_domain":
      - system
    "rule-set:cn_domain":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query
    "geosite:category-ntp":
      - https://223.5.5.5/dns-query
      - https://223.6.6.6/dns-query

  nameserver:
    - https://1.1.1.1/dns-query#RULES
    - https://8.8.8.8/dns-query#RULES

  respect-rules: true
  use-hosts: true
  use-system-hosts: true
  
# 出站策略
# 注意锚点必须放在引用的上方，可以集中把锚点全部放yaml的顶部。
pr: &pr { type: select, proxies: [🚀 默认代理, 🌐 全部节点, 🇭🇰 香港节点, 🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点, 直连], <<: *A }
proxy-groups:
  - {
      name: 🚀 默认代理,
      type: select,
      include-all: true,
      proxies: [🌐 全部节点],
    }
  - { name: 🌐 全部节点, type: select, include-all: true }
  - { name: 🤖 ChatGPT, type: select, proxies: [🚀 默认代理, 🇭🇰 香港节点,  🇹🇼 台湾节点, 🇯🇵 日本节点, 🇸🇬 狮城节点, 🇺🇸 美国节点,🌐 全部节点], include-all: true }
  - { name: 🔗 链式代理基点, type: select, use: [3.额外地址] }
  - { name: 🔄 订阅更新, type: select, proxies: [直连, 🚀 默认代理] }
  - { name: 📹 PikPak, <<: *pr }
  - { name: 📹 YouTube, <<: *pr }
  - { name: 🍀 Google, <<: *pr }
  - { name: 👨🏿‍💻 GitHub, <<: *pr }
  - { name: 🐬 OneDrive, <<: *pr }
  - { name: 🪟 Microsoft, <<: *pr }
  - { name: 🎵 TikTok, <<: *pr }
  - { name: 📲 Telegram, <<: *pr }
  - { name: 🎥 NETFLIX, <<: *pr }
  - { name: ✈️ Speedtest, <<: *pr }
  - { name: 💶 PayPal, <<: *pr }
  - { name: 🍎 Apple, type: select, proxies: [直连, 🚀 默认代理] }
  - { name: 🎯 直连, type: select, proxies: [直连, 🚀 默认代理] }
  - { name: 🐟 漏网之鱼, <<: *pr }
  - {name: 🇭🇰 香港节点, type: select, include-all: true, filter: "(?=.*(🇭🇰|港|HK|(?i)Hong))^((?!(落地|自建|台|日|韩|新|深|美)).)*$"}
  - {name: 🇹🇼 台湾节点, type: select, include-all: true, filter: "(?=.*(🇹🇼|台|TW|(?i)Taiwan))^((?!(落地|自建|港|日|韩|新|深|美)).)*$"}
  - {name: 🇯🇵 日本节点, type: select, include-all: true, filter: "(?=.*(🇯🇵|日|JP|(?i)Japan))^((?!(落地|自建|港|台|韩|新|美)).)*$"}
  - {name: 🇸🇬 狮城节点, type: select, include-all: true, filter: "(?=.*(🇸🇬|新加坡|坡|狮城|SG|Singapore))^((?!(落地|自建|台|日|韩|深|美)).)*$"}
  - {name: 🇺🇸 美国节点, type: select, include-all: true, filter: "(?=.*(🇺🇸|美|US|(?i)States|America))^((?!(落地|自建|港|台|韩|新|日)).)*$"}

# 规则匹配
# 此规则部分没有做防泄露处理，因为弊严重大于利！
